[package]
name = "oyant"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Dictee vocale locale, multiplateforme"
publish = false

[[bin]]
name = "oyant"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` des maintenant : l'application vit dans la zone de notification, la fenetre n'en
# est qu'une facette. L'icone arrive a l'etape 2.
# `image-png` : les icones de barre sont des PNG embarques, decodes par Tauri a l'execution.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
# Gere l'inscription au demarrage du systeme. Sur Windows il s'agit de la cle de registre
# HKCU\Software\Microsoft\Windows\CurrentVersion\Run, donc sans elevation.
tauri-plugin-autostart = "2"
serde_json = "1.0.151"
ureq = "2"
sha2 = "0.11.0"
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
# Capture microphone. Multiplateforme des le depart : WASAPI, CoreAudio et ALSA derriere une
# seule interface, ce qui evite d'ecrire une capture Windows en dur puis de la reecrire.
cpal = "0.18.2"
# Raccourci global. ⚠️ Il doit rendre l'appui ET le relachement : le raccourci d’Oyant se tient
# enfonce, il ne se declenche pas d'une pression.
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.3"
tauri-plugin-notification = "2.4.0"
tar = "0.4.46"
flate2 = "1.1.10"
# tar.bz2 : le format des programmes sherpa-onnx (SenseVoice). Rust pur, rien a installer.
bzip2 = "0.6"

# ── Appairage telephone <-> ordinateur (etape 11) ─────────────────────────────
#
# ⚠️ `tokio` est declare EXPLICITEMENT bien que Tauri en tire deja un : dependre d'une caisse par
# transitivite, c'est laisser une mise a jour de Tauri decider de notre version. Le parc a deja paye
# ce genre d'implicite (voir la lecon sur `setup-node` saute « parce que la machine a deja Node »).
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "sync", "time"] }
# TLS. ⛔ `rustls` et pas `native-tls` : on EPINGLE notre propre certificat auto-signe a
# l'appairage, donc les magasins de certificats du systeme ne servent a rien ici, et les faire
# intervenir n'ajouterait que des facons d'echouer differemment selon l'OS.
#
# ⛔ `default-features = false` + `ring` est INDISPENSABLE, ce n'est pas une preference : par
# defaut `rustls` 0.23 prend le fournisseur `aws-lc-rs`, qui tire `aws-lc-sys` et **CMake**, donc
# une chaine de compilation C a installer sur les trois OS de la CI. Mesure du 2026-09-25 :
# `cargo fetch` ajoutait `aws-lc-rs`, `aws-lc-sys`, `cmake` et `jobserver`. Le decouvrir au premier
# build vert sur une machine et rouge sur les deux autres aurait coute bien plus cher.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Generation du certificat auto-signe, a l'installation. Pur Rust, donc pas d'OpenSSL a trainer.
rcgen = "0.13"
# Lecture des PEM que `rcgen` produit, pour les donner a `rustls`.
rustls-pemfile = "2"
# WebSocket par-dessus le TLS ci-dessus.
tokio-tungstenite = "0.24"
# ⚠️ `futures-util` est necessaire pour lire/ecrire sur le flux WebSocket (`StreamExt`,
# `SinkExt`) : `tokio-tungstenite` expose un `Stream`/`Sink` sans reexporter les extensions.
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
# Decouverte zeroconf. ⚠️ Pur Rust volontairement : les liaisons vers le Bonjour d'Apple ou vers
# Avahi imposeraient une dependance NATIVE differente par plateforme, exactement ce que la decision
# « multiplateforme des le depart » cherche a eviter.
mdns-sd = "0.21"
# Defi d'appairage. ⛔ Doit venir d'un generateur cryptographique : un defi previsible se rejoue.
rand = "0.9"
# Verification de signature Ed25519 (identite du telephone). ⚠️ Declaree EXPLICITEMENT bien que
# `rustls` en tire deja une version par sa feature "ring" : meme motif que `tokio` ci-dessus, ne
# pas laisser une mise a jour de rustls decider silencieusement de NOTRE version de `ring`.
ring = "0.17"
# Encodage des cles et signatures echangees en JSON (elles sont binaires). ⚠️ Egalement deja
# tiree par transitivite (tauri, rustls-pemfile) sous plusieurs versions : la declarer nous-memes
# fixe celle que NOTRE code appelle, independamment de ce que d'autres dependances choisissent.
base64 = "0.22"

# ⚠️ Uniquement sur Windows : l'injection au curseur y passe par `SendInput`. Ailleurs elle a une
# autre implementation (voir `src/platform/mod.rs`), et lier cette caisse partout ferait echouer
# la compilation des autres cibles pour une dependance qui ne les concerne pas.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_WinRT", "Media_Control", "Foundation", "Foundation_Collections"] }

# Pour les tests seulement : un lecteur Windows que le test lance lui-meme, afin d'eprouver la
# pause de la musique sans jamais toucher a celle de la personne devant la machine.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.2", features = ["Media_Playback", "Media_Core", "Storage", "Storage_Streams", "Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
enigo = "0.6.1"
# MPRIS sur le bus de session, pour mettre la musique en pause pendant la dictee (`medias.rs`).
# Rust pur : pas de libdbus a installer sur la machine.
zbus = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
